[project]
name = "PyBlade"
version = "0.2.1"
description = "PyBlade is a lightweight template engine for Python, initially designed for Django. Inspired by Laravel's Blade and Livewire, it simplifies dynamic template creation with developer-friendly @-based directives and component support, all while prioritizing security."
authors = [
    { name = "AntaresMugisho", email = "hi@antaresmugisho.com" },
    { name = "Prince Lulinda", email = "princelulinda@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "questionary>=2.0.1,<3",
    "colorama>=0.4.6,<1",
    "rich>=13.9.4,<14",
    "click>=8.1.8,<9",
    "polib>=1.2.0,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1,<5",
    "pytest>=8.3.3,<9",
    "django>=5.1.2,<6",
    "flask>=3.0.3,<4",
]

[project.scripts]
pyblade = "pyblade.cli.main:cli"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"